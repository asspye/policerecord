services:
  tv-recorder:
    build: .
    container_name: tv-recorder
    restart: unless-stopped
    # Для приёма UDP мультикаст нужна сеть хоста
    network_mode: host
    environment:
      - CONFIG_PATH=/opt/tv-recorder/config/channels.yaml
      - API_PORT=5000
      - TZ=Europe/Moscow
    # Intel GPU для recording.hwaccel: vaapi
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Конфиг — редактируется через API, нужен персистентный
      - ./config:/opt/tv-recorder/config
      # Записи
      - /mnt/recordings:/opt/tv-recorder/recordings
      # Логи
      - ./logs:/opt/tv-recorder/logs
    # Мягкий лимит ресурсов
    deploy:
      resources:
        limits:
          memory: 27G
